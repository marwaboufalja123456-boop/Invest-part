      /* Boutons Modernes avec touche or */
      .btn-primary {
        background-image: linear-gradient(135deg, #dec07a 0%, #c5a059 50%, #a38038 100%);
        color: white;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(197, 160, 89, 0.5);
      }
      .btn-primary::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
        transform: translateX(-100%);
        transition: 0.5s;
      }
      .btn-primary:hover::after {
        transform: translateX(100%);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        transition: all 0.3s ease;
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: #c5a059;
        color: #dec07a;
      }
      
      /* Moroccan Separator */
      .separator-moroccan {
        display: flex;
        align-items: center;
        text-align: center;
        color: #c5a059;
      }
      .separator-moroccan::before,
      .separator-moroccan::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #e8d297;
      }
      .separator-moroccan::not(:empty)::before {
        margin-right: .5em;
      }
      .separator-moroccan::not(:empty)::after {
        margin-left: .5em;
